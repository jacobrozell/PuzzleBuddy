included:
  - App
  - AppTests
  - AppUITests

opt_in_rules:
  - force_unwrapping

force_unwrapping:
  severity: warning

line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - a
    - b
    - c
    - h
    - m
    - i
    - j
    - x
    - y
    - id
    - on
    - ui
    - ps
    - eh

type_name:
  excluded:
    - DS
    - PuzzleForm_Preview
    - Puzzle_BuddyUITestsLaunchTests

file_length:
  warning: 500
  error: 1500

type_body_length:
  warning: 400
  error: 1200

function_body_length:
  warning: 80
  error: 150

custom_rules:
  no_print_statements:
    included: "App/.*\\.swift"
    name: No Print Statements
    regex: '^\s*print\('
    message: "Use AppLog instead of print() in production code."
    severity: warning
